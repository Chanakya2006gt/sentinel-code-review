rules:
  - id: python-sql-injection-cwe-89
    languages:
      - python
    message: "Potential SQL Injection detected via string concatenation/f-string into SQL query execution."
    severity: ERROR
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: $CURSOR.execute(f"...", ...)
      - pattern: $CURSOR.execute(f"...")
      - pattern: $CURSOR.execute("..." % (...), ...)
      - pattern: $CURSOR.execute("..." + ..., ...)
      - pattern: $CURSOR.execute("...".format(...), ...)
      - pattern: $CURSOR.execute($QUERY + ...)
      - patterns:
          - pattern-inside: |
              $QUERY = f"..."
              ...
              $CURSOR.execute($QUERY, ...)
          - pattern: $CURSOR.execute($QUERY, ...)
      - patterns:
          - pattern-inside: |
              $QUERY = f"..."
              ...
              $CURSOR.execute($QUERY)
          - pattern: $CURSOR.execute($QUERY)

  - id: hardcoded-secret-cwe-798-py
    languages:
      - python
    message: "Hardcoded secret or private credential token detected in source code."
    severity: ERROR
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021 - Identification and Authentication Failures"
    pattern-regex: '(?i)(api[_-]?key|secret[_-]?key|auth[_-]?token|access[_-]?token|private[_-]?key)\s*[:=]\s*[''"][a-zA-Z0-9_\-]{16,}[''"]'

  - id: hardcoded-secret-cwe-798-js
    languages:
      - javascript
    message: "Hardcoded secret or private credential token detected in source code."
    severity: ERROR
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021 - Identification and Authentication Failures"
    pattern-regex: '(?i)(api[_-]?key|secret[_-]?key|auth[_-]?token|access[_-]?token|private[_-]?key)\s*[:=]\s*[''"][a-zA-Z0-9_\-]{16,}[''"]'

  - id: dangerous-eval-exec-cwe-95-py
    languages:
      - python
    message: "Use of dangerous dynamic execution function (eval/exec) which can allow arbitrary code execution."
    severity: ERROR
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: eval(...)
      - pattern: $X = eval(...)
      - pattern: exec(...)
      - pattern: $X = exec(...)

  - id: dangerous-eval-exec-cwe-95-js
    languages:
      - javascript
    message: "Use of dangerous dynamic execution function (eval) which can allow arbitrary code execution."
    severity: ERROR
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: eval(...)
      - pattern: const $X = eval(...)
      - pattern: let $X = eval(...)
      - pattern: var $X = eval(...)

  - id: javascript-forgotten-await-cwe-670
    languages:
      - javascript
      - typescript
    message: "Asynchronous function invoked without 'await', returning a pending Promise rather than resolved value."
    severity: WARNING
    metadata:
      cwe: "CWE-670"
    pattern-either:
      - pattern: const $ROLES = fetchUserPermissions(...)
      - pattern: let $ROLES = fetchUserPermissions(...)
      - pattern: var $ROLES = fetchUserPermissions(...)
